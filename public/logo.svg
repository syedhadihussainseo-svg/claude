<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Hexagonal badge mark -->
  <g transform="translate(4,4)">
    <!-- Outer hex -->
    <polygon points="36,0 62,15 62,45 36,60 10,45 10,15" fill="none" stroke="#C8A45A" stroke-width="1.5"/>
    <!-- Inner hex -->
    <polygon points="36,7 56,18.5 56,41.5 36,53 16,41.5 16,18.5" fill="rgba(200,164,90,0.06)" stroke="#C8A45A" stroke-width="0.5"/>
    <!-- MZ monogram -->
    <text x="36" y="38" font-family="'Inter','Arial Black',sans-serif" font-size="22" font-weight="900" fill="#C8A45A" text-anchor="middle" letter-spacing="-1">MZ</text>
    <!-- Top accent line -->
    <line x1="24" y1="10" x2="48" y2="10" stroke="#C8A45A" stroke-width="0.75" opacity="0.4"/>
    <!-- Bottom accent line -->
    <line x1="24" y1="50" x2="48" y2="50" stroke="#C8A45A" stroke-width="0.75" opacity="0.4"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(80,10)">
    <!-- MENZ -->
    <text x="0" y="30" font-family="'Inter','Arial Black',sans-serif" font-size="28" font-weight="900" fill="#F0F0F0" letter-spacing="-0.5">MENZ</text>
    <!-- CULTURE in gold -->
    <text x="0" y="58" font-family="'Inter','Arial',sans-serif" font-size="17" font-weight="400" fill="#C8A45A" letter-spacing="5">CULTURE</text>
    <!-- Accent bar between lines -->
    <rect x="0" y="35" width="116" height="1.5" fill="#C8A45A" opacity="0.35"/>
  </g>
</svg>
